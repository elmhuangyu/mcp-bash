services:
  mcp-bash:
    build: .
    image: ghcr.io/elmhuangyu/mcp-bash:latest
    container_name: mcp-bash
    user: "99:100"
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_ADDR: ":8080"
      MCP_DEFAULT_TIMEOUT_SECONDS: "60"
      MCP_MAX_TIMEOUT_SECONDS: "600"
      MCP_MAX_OUTPUT_BYTES: "131072"
    # Uncomment to persist tools or files installed under $HOME/.local:
    # volumes:
    #   - ./data/agent-home:/home/agent
