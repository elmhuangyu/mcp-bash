name: Test on Push

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

env:
  GOIMPORTS_VERSION: latest
  GOLANGCI_LINT_VERSION: latest

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@${{ env.GOIMPORTS_VERSION }}

      - name: Install golangci-lint
        run: curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Format check
        run: |
          out="$($(go env GOPATH)/bin/goimports -local github.com/elmhuangyu/mcp-bash -l .)"
          if [ -n "$out" ]; then echo "goimports needed on:" >&2; echo "$out" >&2; exit 1; fi

      - name: Lint check
        run: $(go env GOPATH)/bin/golangci-lint run ./...

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test -race ./...
